[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "splendor-game"
version = "0.1.0"
description = "Native Splendor game engine, match clocks and a practical-play host"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["splendor_game", "splendor_play"]

[tool.setuptools.package-data]
splendor_game = ["*.pxd"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "setup.py" }, { file = "MANIFEST.in" },
  { file = "CMakeLists.txt" }, { file = "cmake/*" },
  { file = "src/**/*.cpp" }, { file = "src/**/*.hpp" }, { file = "include/**/*.hpp" },
  { file = "python/**/*.py" }, { file = "python/**/*.pyx" }, { file = "python/**/*.pxd" },
  { file = "third_party/picosha2/*" }, { file = "data/**/*.json" },
  { env = "SPLENDOR_GAME_SEED_NAMESPACE" },
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
