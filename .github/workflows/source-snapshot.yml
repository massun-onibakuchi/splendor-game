name: source-snapshot
on:
  push:
    branches: [research/source-snapshot-20261128]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/game-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: game-source
          path: /tmp/game-source.tar.gz
          retention-days: 1
          if-no-files-found: error
